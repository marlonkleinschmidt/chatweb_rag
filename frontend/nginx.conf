# nginx server block for the static Vue bundle (single-page app).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: unknown paths return index.html so client-side routing
    # works on hard refresh. No API proxy here on purpose: the frontend calls
    # the backend directly via VITE_API_BASE_URL (api.ts requires it).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets, so they are
    # immutable and can be cached for a year.
    location /assets/ {
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }
}
